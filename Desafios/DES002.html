<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Prático de HTML:5</title>
</head>
<body>
    <h1>Guia Prático de HTML:5</h1>
    <h2>Introdução ao HTML:5</h2>
    <h4>Este é um guia prático para aprender HTML:5.</h4>
    <h3>
        principais tags do HTML:5
    </h3>
    <ul>
        <li><abbr title="a tag &lt;p&gt; serve para criar parágrafos">&lt;p&gt;</abbr></li>
        <li><abbr title="as tags &lt;h1&gt; a &lt;h6&gt; servem para criar títulos">&lt;h1&gt; a &lt;h6&gt;</abbr></li>
        <li><abbr title="a tag &lt;ul&gt; serve para criar listas não ordenadas">&lt;ul&gt;</abbr></li>
        <li><abbr title="a tag &lt;ol&gt; serve para criar listas ordenadas">&lt;ol&gt;</abbr></li>
        <li><abbr title="a tag &lt;img&gt; serve para criar imagens">&lt;img&gt;</abbr></li>
        <li><abbr title="a tag &lt;a&gt; serve para criar links">&lt;a&gt;</abbr></li>
        <li><abbr title="a tag &lt;strong&gt; serve para criar texto em negrito">&lt;strong&gt;</abbr></li>
        <li><abbr title="a tag &lt;em&gt; serve para criar texto em itálico">&lt;em&gt;</abbr></li>
        <li><abbr title="a tag &lt;q&gt; serve para criar citações">&lt;q&gt;</abbr></li>
        <li><abbr title="a tag &lt;blockquote&gt; serve para criar citações em bloco">&lt;blockquote&gt;</abbr></li>
        <li><abbr title="a tag &lt;abbr&gt; serve para criar abreviações">&lt;abbr&gt;</abbr></li>
        <li><abbr title="a tag &lt;code&gt; serve para criar código">&lt;code&gt;</abbr></li>
        <li><abbr title="a tag &lt;pre&gt; serve para criar texto pré-formatado">&lt;pre&gt;</abbr></li>
    </ul>
</body>
</html>
