<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Exercício de Mídias em HTML5</h1>
    <p>tente usar este site em multiplas midias diferentes para testar a responsividade.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="EX011/imagens/foto.p.jpg">    
        <source media="(max-width: 1050px)" srcset="EX011/imagens/foto.m.jpg">
        <img src="EX011/imagens/foto.g.jpg" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo audios</h1>
    <p>Vamos aprender a reproduzir áudios no HTML5:</p>
    <audio preload="metadata" controls>
        <source src="EX011/midia/progresso.wav.wav" type="audio/wav">
        <source src="EX011/midia/progresso.ogg" type="audio/ogg">
        <source src="EX011/midia/progresso.mp3" type="audio/mpeg">
        <p>Seu navegador não suporta a reprodução deste áudio.</p>
        <a href="/EX011/midia/progresso.wav.wav" download>Download do áudio</a>
    </audio>   <!--tipos de audios MP3, OGG, WAV-->
</body>
